services:
  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: quickbite-restaurant-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: quickbite-order-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/orders.db
      - RESTAURANT_SERVICE_URL=http://restaurant-service:5001
      - DELIVERY_SERVICE_URL=http://delivery-service:5003
    volumes:
      - order-data:/app/data
    networks:
      - food-delivery-net
    depends_on:
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: quickbite-delivery-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/delivery.db
      - ORDER_SERVICE_URL=http://order-service:5002
    volumes:
      - delivery-data:/app/data
    networks:
      - food-delivery-net
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickbite-frontend
    ports:
      - "3000:80"
    networks:
      - food-delivery-net
    depends_on:
      - restaurant-service
      - order-service
      - delivery-service
    restart: unless-stopped

volumes:
  order-data:
    name: quickbite-order-data
  delivery-data:
    name: quickbite-delivery-data

networks:
  food-delivery-net:
    name: quickbite-network
    driver: bridge
